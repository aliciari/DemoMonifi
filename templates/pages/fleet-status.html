<!-- ============ FLEET STATUS ============ -->
<sc-if value="{{is.fleet}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #0f172a">Fleet Status</h1>
<p style="margin: 6px 0 0; font-size: 13px; color: #6b7280">Vehicle health • Utilization • Maintenance planning</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
<sc-for list="{{fleetKpis}}" as="k" hint-placeholder-count="4">
<div style="background: {{k.bg}}; border: 1px solid {{k.bd}}; border-radius: 10px; padding: 14px 16px"><div style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6b7280">{{k.label}}</div><div style="margin-top: 6px; font-size: 24px; font-weight: 700; color: {{k.color}}">{{k.value}}</div><div style="margin-top: 4px; font-size: 12px; color: {{k.subColor}}">{{k.sub}}</div></div>
</sc-for>
</div>
<section style="background: #ffffff; border: 1px solid #e3e7ed; border-radius: 10px; padding: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #4b5563">Fleet Inventory</h2>
<div role="group" aria-label="Filter by status" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{fleetFilters}}" as="c" hint-placeholder-count="7"><button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 12px; font-weight: 600">{{c.label}} <span style="font-weight: 500; opacity: .75">{{c.count}}</span></button></sc-for>
</div>
</div>
<div style="overflow-x: auto; max-height: 620px; overflow-y: auto">
<div style="min-width: 940px">
<div style="position: sticky; top: 0; background: #ffffff; display: grid; grid-template-columns: .8fr 1fr 1fr 1.4fr .9fr .9fr 1fr 1.6fr .7fr; gap: 8px; padding: 10px 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6b7280; border-bottom: 1px solid #e3e7ed"><span>ID</span><span>Type</span><span>Status</span><span>Driver</span><span>Utilization</span><span>Cost/Mile</span><span>Next Service</span><span>Alerts</span><span></span></div>
<sc-for list="{{fleetRows}}" as="t" hint-placeholder-count="15">
<div style="display: grid; grid-template-columns: .8fr 1fr 1fr 1.4fr .9fr .9fr 1fr 1.6fr .7fr; gap: 8px; align-items: center; padding: 8px; font-size: 13px; border-bottom: 1px solid #eef0f3">
<span style="font-weight: 700">{{t.id}}</span>
<span style="color: #374151">{{t.type}}</span>
<span><span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: {{t.pillBg}}; color: {{t.pillFg}}; white-space: nowrap">{{t.statusLabel}}</span></span>
<span style="color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.driverTxt}}</span>
<span style="color: #374151">{{t.util}}</span>
<span style="color: #374151">{{t.cpm}}</span>
<span style="color: {{t.nextC}}; font-weight: 600">{{t.next}}</span>
<span><span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: {{t.aBg}}; color: {{t.aFg}}">{{t.alert}}</span></span>
<button type="button" onClick="{{t.pickGo}}" aria-label="Show {{t.id}} on the map" style="min-height: 30px; padding: 0 8px; border: 1px solid #d5dae2; border-radius: 6px; background: #ffffff; color: #1d6fa5; font-size: 11px; font-weight: 700">Map</button>
</div>
</sc-for>
</div>
</div>
</section>
</div>
</sc-if>
