<!-- ============ DRIVER DEVELOPMENT ============ -->
<sc-if value="{{is.driver}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #0f172a">Driver Development</h1>
<p style="margin: 6px 0 0; font-size: 13px; color: #6b7280">Training progress • Lane familiarity • Onboarding</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
<sc-for list="{{devKpis}}" as="k" hint-placeholder-count="4">
<div style="background: {{k.bg}}; border: 1px solid {{k.bd}}; border-radius: 10px; padding: 14px 16px"><div style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6b7280">{{k.label}}</div><div style="margin-top: 6px; font-size: 24px; font-weight: 700; color: {{k.color}}">{{k.value}}</div><div style="margin-top: 4px; font-size: 12px; color: {{k.subColor}}">{{k.sub}}</div></div>
</sc-for>
</div>
<section style="background: #ffffff; border: 1px solid #e3e7ed; border-radius: 10px; padding: 16px">
<h2 style="margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #4b5563">Training roster ({{rosterCount}})</h2>
<sc-for list="{{roster}}" as="t" hint-placeholder-count="10">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 10px 4px; border-bottom: 1px solid #eef0f3">
<div style="flex: 1 1 220px"><div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-weight: 600">{{t.name}}</span><span style="font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: {{t.tagBg}}; color: {{t.tagFg}}">{{t.course}}</span><sc-if value="{{t.isNew}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 700; color: #1d6fa5">Assigned {{t.when}}</span></sc-if></div><div style="font-size: 11px; color: #6b7280">{{t.meta}}</div></div>
<div style="width: 160px"><div style="height: 5px; border-radius: 3px; background: #e5e8ed"><div style="width: {{t.pct}}; height: 5px; border-radius: 3px; background: #6cb3e3"></div></div><div style="margin-top: 3px; font-size: 10px; color: #6b7280">{{t.mods}}</div></div>
<div style="width: 130px; text-align: right; font-size: 12px; color: #374151">Familiarity: <span style="font-weight: 700; color: #0f172a">{{t.fam}}</span></div>
</div>
</sc-for>
</section>
</div>
</sc-if>
