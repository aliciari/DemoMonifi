<!-- ============ SAFETY ============ -->
<sc-if value="{{is.safety}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #0f172a">Safety &amp; Compliance</h1>
<p style="margin: 6px 0 0; font-size: 13px; color: #6b7280">Incident tracking • Driver scores • Risk management</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
<sc-for list="{{safeKpis}}" as="k" hint-placeholder-count="4">
<div style="background: {{k.bg}}; border: 1px solid {{k.bd}}; border-radius: 10px; padding: 14px 16px"><div style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6b7280">{{k.label}}</div><div style="margin-top: 6px; font-size: 24px; font-weight: 700; color: {{k.color}}">{{k.value}}</div><div style="margin-top: 4px; font-size: 12px; color: {{k.subColor}}">{{k.sub}}</div></div>
</sc-for>
</div>
<section style="background: #ffffff; border: 1px solid #e3e7ed; border-radius: 10px; padding: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #4b5563">Drivers requiring attention ({{safetyCount}})</h2>
<button type="button" onClick="{{assignAllSafety}}" style="min-height: 34px; padding: 0 12px; border: 1px solid #1e3a6e; border-radius: 8px; background: #ffffff; color: #1e3a6e; font-size: 12px; font-weight: 700">Assign training to all</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{safetyList}}" as="d" hint-placeholder-count="8">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: #f4f6f9; border-radius: 8px; padding: 8px 12px">
<div style="flex: 1 1 220px"><div style="font-weight: 600; font-size: 13px">{{d.name}} <span style="font-weight: 500; color: #6b7280">• {{d.truck}}</span></div><div style="font-size: 11px; color: #6b7280">{{d.meta}}</div></div>
<span style="font-weight: 700; font-size: 16px; color: #dc2626">{{d.score}}</span>
<button type="button" onClick="{{d.assign}}" style="min-height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: {{d.bg}}; color: {{d.fg}}; font-size: 12px; font-weight: 700">{{d.label}}</button>
</div>
</sc-for>
</div>
</section>
</div>
</sc-if>
